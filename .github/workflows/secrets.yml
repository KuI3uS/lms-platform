name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        run: sh scripts/install-gitleaks.sh
      - name: Verify protection against accidental credentials
        run: python3 scripts/test-secret-protection.py
      - name: Scan reachable history for SMTP passwords
        run: .tools/gitleaks git --redact --no-banner --ignore-gitleaks-allow --max-archive-depth 2 --log-opts="--all" --enable-rule=lms-mail-password --config .gitleaks.toml .
      - name: Scan all new changes for other secrets
        # Scan every new change after the cleaned SMTP history boundary.
        run: .tools/gitleaks git --redact --no-banner --ignore-gitleaks-allow --max-archive-depth 2 --log-opts="ac865ff695c8c65ccc62708658686ae806345c6a..HEAD" --config .gitleaks.toml .
