spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
server.forward-headers-strategy=framework

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
code.runner.enabled=${CODE_RUNNER_ENABLED:true}
code.runner.docker-binary=${CODE_RUNNER_DOCKER_BINARY:docker}
code.runner.java-image=${CODE_RUNNER_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
code.runner.provider=${CODE_RUNNER_PROVIDER:docker}
# Paid cloud execution is fail-closed until explicitly activated on the backend.
code.runner.render.approved=${CODE_RUNNER_RENDER_APPROVED:false}
code.runner.render.api-key=${CODE_RUNNER_RENDER_API_KEY:}
code.runner.render.workspace-id=${CODE_RUNNER_RENDER_WORKSPACE_ID:}
code.runner.render.group-id=${CODE_RUNNER_RENDER_GROUP_ID:}
code.runner.render.image-id=${CODE_RUNNER_RENDER_IMAGE_ID:}
# Durable shared monthly counter; hard ceiling of 1000 x 60-second, 1c-2g VMs.
code.runner.render.monthly-launch-limit=${CODE_RUNNER_RENDER_MONTHLY_LAUNCH_LIMIT:1000}
frontend.url=${FRONTEND_URL}
server.port=${PORT:10000}

# Ochrona rejestracji przed automatycznymi próbami i adresami tymczasowymi.
registration.security.enabled=${REGISTRATION_SECURITY_ENABLED:true}
registration.rate-limit.window-minutes=${REGISTRATION_RATE_LIMIT_WINDOW_MINUTES:15}
registration.rate-limit.max-per-ip=${REGISTRATION_RATE_LIMIT_MAX_PER_IP:5}
registration.rate-limit.max-per-email=${REGISTRATION_RATE_LIMIT_MAX_PER_EMAIL:3}
registration.disposable-email.enabled=${DISPOSABLE_EMAIL_BLOCKING_ENABLED:true}
registration.disposable-email.extra-blocked=${DISPOSABLE_EMAIL_EXTRA_BLOCKED:}
registration.disposable-email.allowed=${DISPOSABLE_EMAIL_ALLOWED:}

# Naturalne głosy dialogów. Klucz i identyfikatory głosów ustawiaj wyłącznie
# jako sekrety hostingu; puste wartości pozostawiają bezpieczny głos awaryjny.
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.female-voice-id=${ELEVENLABS_FEMALE_VOICE_ID:}
elevenlabs.male-voice-id=${ELEVENLABS_MALE_VOICE_ID:}
elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
elevenlabs.stability=${ELEVENLABS_STABILITY:0.50}
elevenlabs.similarity-boost=${ELEVENLABS_SIMILARITY_BOOST:0.75}
elevenlabs.style=${ELEVENLABS_STYLE:0.0}
elevenlabs.speed=${ELEVENLABS_SPEED:0.95}
elevenlabs.speaker-boost=${ELEVENLABS_SPEAKER_BOOST:true}

# Stripe Checkout. Klucze ustawiaj wyłącznie jako sekrety hostingu.
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.frontend-url=${FRONTEND_URL:https://edu-hub.com.pl}
