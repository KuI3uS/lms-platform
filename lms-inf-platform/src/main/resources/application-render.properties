# Small-instance profile, included by the Docker image without replacing active profiles.
# These bounds trade peak concurrency for predictable memory use on 512 MiB instances.
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=50
server.tomcat.processor-cache=16
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=15s

spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50
